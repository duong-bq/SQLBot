          Nếu được, bạn có thể bổ sung thêm một chút thông tin lỗi để người dùng biết nguyên nhân có thể. Ví dụ: "reason": "Không thể sinh cấu hình: kết quả truy vấn SQL được cung cấp không tìm thấy trường phù hợp làm phân loại (series)."
        </rule>

