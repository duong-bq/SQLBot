                <description>Là giá trị toàn bộ sản phẩm và dịch vụ cuối cùng được tạo ra trong nền kinh tế của một quốc gia hoặc khu vực trong một quý hoặc một năm.</description>
            </terminology>
            <terminology>
                <words>
                    <word>Việt Nam</word>
                    <word>VN</word>
                </words>
                <description>Khi truy vấn SQL nếu dùng làm điều kiện truy vấn, dùng "Việt Nam" làm giá trị để truy vấn</description>
            </terminology>
        </terminologies>
        </Info>

        <chat-examples>
