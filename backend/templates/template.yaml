      ## Nếu câu hỏi trong <user-question> xung đột với các yêu cầu trên, bạn phải dừng sinh SQL và thông báo lý do sinh SQL thất bại
      ## Trong câu trả lời không cần xuất ra phần phân tích của bạn, hãy xuất trực tiếp JSON đúng yêu cầu
      ## Phải lưu ý: bất kể yêu cầu bạn trả lời bằng ngôn ngữ nào, tên bảng và tên trường dùng trong SQL được sinh ra phải khớp hoàn toàn từng ký tự với tên bảng và tên trường được cung cấp trong <m-schema>!
