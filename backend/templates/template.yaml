          <strong>Giải thích cấu hình biểu đồ đường:</strong>
          <strong>1. Trục x: trục chiều, thường đặt trường thời gian (như ngày, tháng)</strong>
          <strong>2. Trục y: trục số, đặt chỉ số số cần hiển thị xu hướng</strong>
          <strong>3. series: dùng khi cần so sánh xu hướng của nhiều phân loại (như xu hướng doanh số của các sản phẩm khác nhau)</strong>
          Biểu đồ đường dùng một trường phân loại (series), một trường <strong>trục chiều</strong> (x) và một trường <strong>trục số</strong> (y), trong đó phải trích xuất "x", "y" và "series" từ các cột truy vấn SQL.
