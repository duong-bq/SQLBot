          1. Nếu trong truy vấn SQL tồn tại nhiều trường chỉ số (như "thu nhập", "chi tiêu", "lợi nhuận", v.v. là các trường số) và không tồn tại trường phân loại, thì bắt buộc cung cấp cấu hình multi-quota, có dạng: "multi-quota":{{"name":"loại chỉ số","value":["trường chỉ số 1","trường chỉ số 2",...]}}
          2. Nếu trong truy vấn SQL tồn tại nhiều trường chỉ số và đồng thời tồn tại trường phân loại, thì lấy trường phân loại làm chính, chọn một trong các trường chỉ số làm chỉ số là được, không cần cấu hình multi-quota
