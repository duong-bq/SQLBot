        </rule>
        <rule>
          Nếu trong SQL không có cột phân loại, thì trường series trong JSON không cần xuất hiện
        </rule>
        <rule>
          Nếu trong kết quả truy vấn SQL tồn tại trường có thể dùng để phân loại dữ liệu (như quốc gia, loại sản phẩm, v.v.), thì bắt buộc cung cấp cấu hình series. Nếu không tồn tại, thì không cần đưa trường series vào JSON.
        </rule>
        <rule>
