template:
  quot_rule: |
    <rule>
      Bắt buộc thêm dấu ngoặc vuông ([]) bao quanh tên cơ sở dữ liệu, tên bảng, tên trường, bí danh.
      <note>
        1. Dấu chấm (.) không được nằm trong dấu ngoặc vuông, phải viết thành [schema].[table]
        2. Khi định danh là từ khóa, chứa ký tự đặc biệt hoặc cần giữ hoa/thường thì bắt buộc thêm dấu ngoặc vuông
        3. Định danh SQL Server mặc định không phân biệt hoa/thường
      </note>
    </rule>

  limit_rule: |
    <rule>
      Khi cần giới hạn số dòng, phải dùng cú pháp SQL của Microsoft SQL Server:
      <note>
        1. Cách viết chuẩn: TOP [count]
        2. Cách viết phân trang: OFFSET [start] ROWS FETCH NEXT [count] ROWS ONLY
        3. Cấm dùng cú pháp LIMIT của MySQL
      </note>
    </rule>

  other_rule: |
    <rule>Phải sinh bí danh cho mỗi bảng (không thêm AS)</rule>
    {multi_table_condition}
    <rule>Cấm dùng dấu sao (*), phải nêu rõ tên trường</rule>
    <rule>Trường tiếng Việt/ký tự đặc biệt cần giữ nguyên tên gốc và thêm bí danh tiếng Anh</rule>
    <rule>Trường hàm phải thêm bí danh</rule>
    <rule>Phần trăm hiển thị dạng: CONVERT(VARCHAR, ROUND(x*100,2)) + '%'</rule>
    <rule>Tránh xung đột với từ khóa SQL Server (như [user]/[order]/[desc])</rule>

  basic_example: |
    <basic-examples>
      <intro>
        📌 Các ví dụ sau tuân thủ nghiêm ngặt chuẩn Microsoft SQL Server trong <Rules>, minh họa cách viết SQL đúng yêu cầu và các trường hợp lỗi điển hình.
        ⚠️ Lưu ý: tên bảng, tên trường trong ví dụ đều là hư cấu để minh họa, khi dùng thực tế cần thay bằng định danh thật do người dùng cung cấp.
        🔍 Điểm cần quan sát kỹ:
          1. Cách dùng chuẩn dấu ngoặc vuông bao quanh mọi đối tượng cơ sở dữ liệu
          2. Cách xử lý các trường đặc biệt như bí danh Việt-Anh/phần trăm/hàm
          3. Cách tránh xung đột từ khóa
      </intro>
      <example>
        <input>Truy vấn 100 đơn hàng đầu của bảng Sales.Orders (có trường tiếng Việt và phần trăm)</input>
        <output-bad>
          SELECT * FROM Sales.Orders  -- Lỗi: dùng dấu sao
          SELECT [Mã đơn hàng], [Số tiền] FROM [Sales].[Orders] [o]  -- Lỗi: thiếu bí danh tiếng Anh
          SELECT COUNT([Mã đơn hàng]) FROM [Sales].[Orders] [o]  -- Lỗi: hàm chưa thêm bí danh
        </output-bad>
        <output-good>
          SELECT TOP 100
            [o].[Mã đơn hàng] AS [order_id],
            [o].[Số tiền] AS [amount],
            COUNT([o].[Mã đơn hàng]) AS [total_orders],
            CONVERT(VARCHAR, ROUND([o].[Tỷ lệ chiết khấu] * 100, 2)) + '%' AS [discount_percent]
          FROM [Sales].[Orders] [o]
          GROUP BY [o].[Mã đơn hàng], [o].[Số tiền], [o].[Tỷ lệ chiết khấu]
        </output-good>
      </example>

      <example>
        <input>Thống kê tỷ lệ hoạt động của bảng người dùng dbo.Users (có trường từ khóa user)</input>
        <output-bad>
          SELECT user, status FROM dbo.Users  -- Lỗi: chưa xử lý từ khóa
          SELECT [user], ROUND(active_ratio*100) FROM [dbo].[Users]  -- Lỗi: định dạng phần trăm sai
        </output-bad>
        <output-good>
          SELECT
            [u].[user] AS [user_name],
            CONVERT(VARCHAR, ROUND([u].[active_ratio] * 100, 2)) + '%' AS [active_percent]
          FROM [dbo].[Users] [u]
          WHERE [u].[status] = 1
          ORDER BY [u].[create_date]
          OFFSET 0 ROWS FETCH NEXT 1000 ROWS ONLY
        </output-good>
      </example>
    </basic-examples>

  example_engine: Microsoft SQL Server 2022
  example_answer_1: |
    {"success":true,"sql":"SELECT [country] AS [country_name], [continent] AS [continent_name], [year] AS [year], [gdp] AS [gdp_usd] FROM [Sample_Database].[sample_country_gdp] ORDER BY [country], [year]","tables":["sample_country_gdp"],"chart-type":"line"}
  example_answer_1_with_limit: |
    {"success":true,"sql":"SELECT TOP 1000 [country] AS [country_name], [continent] AS [continent_name], [year] AS [year], [gdp] AS [gdp_usd] FROM [Sample_Database].[sample_country_gdp] ORDER BY [country], [year]","tables":["sample_country_gdp"],"chart-type":"line"}
  example_answer_2: |
    {"success":true,"sql":"SELECT [country] AS [country_name], [gdp] AS [gdp_usd] FROM [Sample_Database].[sample_country_gdp] WHERE [year] = '2024' ORDER BY [gdp] DESC","tables":["sample_country_gdp"],"chart-type":"pie"}
  example_answer_2_with_limit: |
    {"success":true,"sql":"SELECT TOP 1000 [country] AS [country_name], [gdp] AS [gdp_usd] FROM [Sample_Database].[sample_country_gdp] WHERE [year] = '2024' ORDER BY [gdp] DESC","tables":["sample_country_gdp"],"chart-type":"pie"}
  example_answer_3: |
    {"success":true,"sql":"SELECT [country] AS [country_name], [gdp] AS [gdp_usd] FROM [Sample_Database].[sample_country_gdp] WHERE [year] = '2025' AND [country] = N'Việt Nam'","tables":["sample_country_gdp"],"chart-type":"table"}
  example_answer_3_with_limit: |
    {"success":true,"sql":"SELECT TOP 1000 [country] AS [country_name], [gdp] AS [gdp_usd] FROM [Sample_Database].[sample_country_gdp] WHERE [year] = '2025' AND [country] = N'Việt Nam'","tables":["sample_country_gdp"],"chart-type":"table"}
