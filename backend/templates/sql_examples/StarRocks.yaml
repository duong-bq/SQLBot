template:
  quot_rule: |
    <rule>
      Bắt buộc thêm dấu ngoặc ngược (`) bao quanh tên cơ sở dữ liệu, tên bảng, tên trường, bí danh.
      <note>
        1. Dấu chấm (.) không được nằm trong dấu ngoặc ngược, phải viết thành `database`.`table`
        2. Khi định danh là từ khóa, chứa ký tự đặc biệt hoặc cần giữ hoa/thường thì bắt buộc thêm dấu ngoặc ngược
        3. Định danh StarRocks mặc định không phân biệt hoa/thường, nhưng khuyến nghị dùng nhất quán dấu ngoặc ngược
      </note>
    </rule>

  limit_rule: |
    <rule>
      Khi cần giới hạn số dòng, phải dùng cú pháp LIMIT chuẩn
      <note>
        1. Cách viết chuẩn: LIMIT [count]
        2. Cách viết phân trang: LIMIT [count] OFFSET [start]
        3. Hỗ trợ cách viết tương thích MySQL: LIMIT [offset], [count]
      </note>
    </rule>

  other_rule: |
    <rule>Phải sinh bí danh cho mỗi bảng (không thêm AS)</rule>
    {multi_table_condition}
    <rule>Cấm dùng dấu sao (*), phải nêu rõ tên trường</rule>
    <rule>Trường tiếng Việt/ký tự đặc biệt cần giữ nguyên tên gốc và thêm bí danh tiếng Anh</rule>
    <rule>Trường hàm phải thêm bí danh</rule>
    <rule>Phần trăm hiển thị dạng: CONCAT(ROUND(x*100,2),'%')</rule>
    <rule>Tránh xung đột với từ khóa StarRocks (như `rank`/`partition`/`values`)</rule>
    <rule>Truy vấn phân vùng cần dùng câu lệnh PARTITION để chỉ định rõ</rule>
    <rule>Ưu tiên dùng tính năng Colocate Group để tối ưu hiệu năng JOIN</rule>

  basic_example: |
    <basic-examples>
      <intro>
        📌 Các ví dụ sau tuân thủ nghiêm ngặt chuẩn StarRocks (tương thích giao thức MySQL)
        ⚠️ Lưu ý: tên bảng, tên trường trong ví dụ đều là hư cấu để minh họa, khi dùng thực tế cần thay bằng định danh thật do người dùng cung cấp.
        🔍 Điểm cần quan sát kỹ:
          1. Dấu ngoặc ngược bao quanh mọi đối tượng cơ sở dữ liệu
          2. Các tính năng tối ưu MPP như phân vùng/chia bucket
          3. Cách tránh xung đột từ khóa (như `rank`)
      </intro>
      <example>
        <input>Truy vấn 100 đơn hàng đầu của bảng test.orders (có trường tiếng Việt)</input>
        <output-bad>
          SELECT * FROM test.orders LIMIT 100  -- Lỗi: dùng dấu sao
          SELECT `Mã đơn hàng`, `Số tiền` FROM `test`.`orders` `t1`  -- Lỗi: thiếu bí danh tiếng Anh
        </output-bad>
        <output-good>
          SELECT
            `t1`.`Mã đơn hàng` AS `order_id`,
            `t1`.`Số tiền` AS `amount_usd`,
            CONCAT(ROUND(`t1`.`Tỷ lệ chiết khấu` * 100, 2), '%') AS `discount_percent`
          FROM `test`.`orders` `t1`
          PARTITION (`p2023`)  -- Cắt tỉa phân vùng của StarRocks
          LIMIT 100
        </output-good>
      </example>
      <example>
        <input>Thống kê tỷ lệ hoạt động của bảng người dùng dw.users (có từ khóa rank)</input>
        <output-bad>
          SELECT rank, status FROM dw.users  -- Lỗi: chưa xử lý từ khóa
          SELECT `rank`, active_ratio FROM `dw`.`users`  -- Lỗi: phần trăm chưa định dạng
        </output-bad>
        <output-good>
          SELECT
            `u`.`rank` AS `user_rank`,
            CONCAT(ROUND(`u`.`active_ratio` * 100, 2), '%') AS `active_percent`
          FROM `dw`.`users` `u`
          WHERE `u`.`status` = 1
          AND `u`.`dt` = '2024-01-01'  -- Lọc theo khóa phân vùng
          LIMIT 1000
        </output-good>
      </example>
    </basic-examples>

  example_engine: StarRocks 3.0
  example_answer_1: |
    {"success":true,"sql":"SELECT `country` AS `country_name`, `continent` AS `continent_name`, `year` AS `year`, `gdp` AS `gdp_usd` FROM `Sample_Database`.`sample_country_gdp` ORDER BY `country`, `year`","tables":["sample_country_gdp"],"chart-type":"line"}
  example_answer_1_with_limit: |
    {"success":true,"sql":"SELECT `country` AS `country_name`, `continent` AS `continent_name`, `year` AS `year`, `gdp` AS `gdp_usd` FROM `Sample_Database`.`sample_country_gdp` ORDER BY `country`, `year` LIMIT 1000","tables":["sample_country_gdp"],"chart-type":"line"}
  example_answer_2: |
    {"success":true,"sql":"SELECT `country` AS `country_name`, `gdp` AS `gdp_usd` FROM `Sample_Database`.`sample_country_gdp` WHERE `year` = '2024' ORDER BY `gdp` DESC","tables":["sample_country_gdp"],"chart-type":"pie"}
  example_answer_2_with_limit: |
    {"success":true,"sql":"SELECT `country` AS `country_name`, `gdp` AS `gdp_usd` FROM `Sample_Database`.`sample_country_gdp` WHERE `year` = '2024' ORDER BY `gdp` DESC LIMIT 1000","tables":["sample_country_gdp"],"chart-type":"pie"}
  example_answer_3: |
    {"success":true,"sql":"SELECT `country` AS `country_name`, `gdp` AS `gdp_usd` FROM `Sample_Database`.`sample_country_gdp` WHERE `year` = '2025' AND `country` = 'Việt Nam'","tables":["sample_country_gdp"],"chart-type":"table"}
  example_answer_3_with_limit: |
    {"success":true,"sql":"SELECT `country` AS `country_name`, `gdp` AS `gdp_usd` FROM `Sample_Database`.`sample_country_gdp` WHERE `year` = '2025' AND `country` = 'Việt Nam' LIMIT 1000","tables":["sample_country_gdp"],"chart-type":"table"}
