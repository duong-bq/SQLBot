template:
  quot_rule: |
    <rule>
      Bắt buộc thêm dấu nháy kép (") bao quanh tên cơ sở dữ liệu, tên bảng, tên trường, bí danh.
      <note>
        1. Dấu chấm (.) không được nằm trong dấu nháy, phải viết thành "schema"."table"
        2. Ngay cả khi định danh không chứa ký tự đặc biệt hoặc không phải từ khóa, vẫn bắt buộc thêm dấu nháy kép
        3. Redshift mặc định chuyển định danh không có dấu nháy thành chữ thường
      </note>
    </rule>

  limit_rule: |
    <rule>
      Khi cần giới hạn số dòng, phải dùng LIMIT hoặc FETCH FIRST để giới hạn số dòng (Redshift tương thích PostgreSQL)
      <note>
        1. Cách viết chuẩn: LIMIT 100
        2. Cách viết tùy chọn: FETCH FIRST 100 ROWS ONLY
      </note>
    </rule>

  other_rule: |
    <rule>Phải sinh bí danh cho mỗi bảng (không thêm AS)</rule>
    {multi_table_condition}
    <rule>Cấm dùng dấu sao (*), phải nêu rõ tên trường</rule>
    <rule>Trường tiếng Việt/ký tự đặc biệt cần giữ nguyên tên gốc và thêm bí danh tiếng Anh</rule>
    <rule>Trường hàm phải thêm bí danh</rule>
    <rule>Trường phần trăm giữ hai chữ số thập phân và kết thúc bằng % (dùng ROUND+CONCAT)</rule>
    <rule>Tránh xung đột với từ khóa Redshift (như USER/GROUP/ORDER, v.v.)</rule>

  basic_example: |
    <basic-examples>
      <intro>
        📌 Các ví dụ sau tuân thủ nghiêm ngặt chuẩn AWS Redshift trong <Rules>, minh họa cách viết SQL đúng yêu cầu và các trường hợp lỗi điển hình.
        ⚠️ Lưu ý: tên bảng, tên trường trong ví dụ đều là hư cấu để minh họa, khi dùng thực tế cần thay bằng định danh thật do người dùng cung cấp.
        🔍 Điểm cần quan sát kỹ:
          1. Cách dùng chuẩn dấu nháy kép bao quanh mọi đối tượng cơ sở dữ liệu
          2. Cách xử lý các trường đặc biệt như bí danh Việt-Anh/phần trăm/hàm
          3. Cách tránh xung đột từ khóa
      </intro>
      <example>
        <input>Truy vấn 100 đơn hàng đầu của bảng TEST.SALES (có tính phần trăm)</input>
        <output-bad>
          SELECT * FROM TEST.SALES LIMIT 100  -- Lỗi: chưa thêm dấu nháy, dùng dấu sao
          SELECT "Mã đơn hàng", "Số tiền" FROM "TEST"."SALES" "t1" FETCH FIRST 100 ROWS ONLY  -- Lỗi: thiếu bí danh tiếng Anh
          SELECT COUNT("Mã đơn hàng") FROM "TEST"."SALES" "t1"  -- Lỗi: hàm chưa thêm bí danh
        </output-bad>
        <output-good>
          SELECT
            "t1"."Mã đơn hàng" AS "order_id",
            "t1"."Số tiền" AS "amount",
            COUNT("t1"."Mã đơn hàng") AS "total_orders",
            CONCAT(ROUND("t1"."Tỷ lệ chiết khấu" * 100, 2), '%') AS "discount_percent"
          FROM "TEST"."SALES" "t1"
          GROUP BY "t1"."Mã đơn hàng", "t1"."Số tiền", "t1"."Tỷ lệ chiết khấu"
          LIMIT 100
        </output-good>
      </example>

      <example>
        <input>Thống kê tỷ lệ hoạt động của bảng người dùng PUBLIC.USERS (có trường từ khóa user)</input>
        <output-bad>
          SELECT user, status FROM PUBLIC.USERS  -- Lỗi: chưa xử lý từ khóa và dấu nháy
          SELECT "user", ROUND(active_ratio) FROM "PUBLIC"."USERS"  -- Lỗi: định dạng phần trăm sai
        </output-bad>
        <output-good>
          SELECT
            "u"."user" AS "user_account",
            CONCAT(ROUND("u"."active_ratio" * 100, 2), '%') AS "active_percent"
          FROM "PUBLIC"."USERS" "u"
          WHERE "u"."status" = 1
          FETCH FIRST 1000 ROWS ONLY
        </output-good>
      </example>
    </basic-examples>

  example_engine: AWS Redshift 1.0
  example_answer_1: |
    {"success":true,"sql":"SELECT \"country\" AS \"country_name\", \"continent\" AS \"continent_name\", \"year\" AS \"year\", \"gdp\" AS \"gdp_usd\" FROM \"Sample_Database\".\"sample_country_gdp\" ORDER BY \"country\", \"year\"","tables":["sample_country_gdp"],"chart-type":"line"}
  example_answer_1_with_limit: |
    {"success":true,"sql":"SELECT \"country\" AS \"country_name\", \"continent\" AS \"continent_name\", \"year\" AS \"year\", \"gdp\" AS \"gdp_usd\" FROM \"Sample_Database\".\"sample_country_gdp\" ORDER BY \"country\", \"year\" LIMIT 1000 OFFSET 0","tables":["sample_country_gdp"],"chart-type":"line"}
  example_answer_2: |
    {"success":true,"sql":"SELECT \"country\" AS \"country_name\", \"gdp\" AS \"gdp_usd\" FROM \"Sample_Database\".\"sample_country_gdp\" WHERE \"year\" = '2024' ORDER BY \"gdp\" DESC","tables":["sample_country_gdp"],"chart-type":"pie"}
  example_answer_2_with_limit: |
    {"success":true,"sql":"SELECT \"country\" AS \"country_name\", \"gdp\" AS \"gdp_usd\" FROM \"Sample_Database\".\"sample_country_gdp\" WHERE \"year\" = '2024' ORDER BY \"gdp\" DESC LIMIT 1000 OFFSET 0","tables":["sample_country_gdp"],"chart-type":"pie"}
  example_answer_3: |
    {"success":true,"sql":"SELECT \"country\" AS \"country_name\", \"gdp\" AS \"gdp_usd\" FROM \"Sample_Database\".\"sample_country_gdp\" WHERE \"year\" = '2025' AND \"country\" = 'Việt Nam'","tables":["sample_country_gdp"],"chart-type":"table"}
  example_answer_3_with_limit: |
    {"success":true,"sql":"SELECT \"country\" AS \"country_name\", \"gdp\" AS \"gdp_usd\" FROM \"Sample_Database\".\"sample_country_gdp\" WHERE \"year\" = '2025' AND \"country\" = 'Việt Nam' LIMIT 1000 OFFSET 0","tables":["sample_country_gdp"],"chart-type":"table"}
