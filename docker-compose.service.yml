services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: sqlbot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: Password123@pg
      POSTGRES_DB: sqlbot
    ports:
      - "5434:5432"
    volumes:
      - ./data/postgresql:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: sqlbot-redis
    restart: unless-stopped
    ports:
      - "6380:6379"