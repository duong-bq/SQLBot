# ===========================================================
# SQLBot - GitLab CI (test, build & push to Harbor)
# CD: Argo CD. Branches: test | staging | master. Runner tag: sqlbot
# CI variables set in GitLab, never here: HARBOR_USER, HARBOR_PASSWORD, GITOPS_PUSH_TOKEN (write access to devops/cicd/h04); optional BASE_VERSION.
# ===========================================================

workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^(test|staging|master)$/'
      when: always
    - when: never

default:
  tags:
    - h04-sqlbot

variables:
  DOCKER_BUILDKIT: "1"
  HARBOR_URL: "dockerhub.elcomlab.com"
  HARBOR_PROJECT: "h04"
  HARBOR_REPO: "h04-sqlbot"
  DOCKER_BUILDKIT_NETWORK: "h04-buildkit"
  SQLBOT_BUILDX_BUILDER: "h04-sqlbot-builder"

stages:
  - test
  - build
  - push
  - deploy
  - cleanup

.sqlbot_rules_env:
  rules:
    - if: $CI_COMMIT_BRANCH == "test"
      variables:
        TAG_PREFIX: "test-"
        DEPLOY_ENVIRONMENT: "test"
    - if: $CI_COMMIT_BRANCH == "staging"
      variables:
        TAG_PREFIX: "stg-"
        DEPLOY_ENVIRONMENT: "staging"
    - if: $CI_COMMIT_BRANCH == "master"
      variables:
        TAG_PREFIX: "prod-"
        DEPLOY_ENVIRONMENT: "production"
  environment:
    name: $DEPLOY_ENVIRONMENT

.sqlbot_rules_deploy:
  rules:
    - if: $CI_COMMIT_BRANCH == "test"
      variables:
        TAG_PREFIX: "test-"
        DEPLOY_ENVIRONMENT: "test"
    - if: $CI_COMMIT_BRANCH == "staging"
      variables:
        TAG_PREFIX: "stg-"
        DEPLOY_ENVIRONMENT: "staging"
  environment:
    name: $DEPLOY_ENVIRONMENT

test:
  stage: test
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^(test|staging|master)$/'
  script:
    - |
      docker run --rm -v "${CI_PROJECT_DIR}:/src:ro" dockerhub.elcomlab.com/wolfi/python:v3.11.17@sha256:fdf85f09b2ccf0d5cb8d68549ddbf615adf0129019f69546bcbc9e8ee73a523c sh -c '
        cp -r /src /home/appuser/work && cd /home/appuser/work &&
        uv sync -q --frozen --python /usr/bin/python3 &&
        .venv/bin/python -m pytest tests -q -p no:cacheprovider'

build:
  extends: .sqlbot_rules_env
  stage: build
  variables:
    # BASE_VERSION: "test-1.0.0" -> build test-1.0.1
    BASE_VERSION: ""
  script:
    - echo "${HARBOR_PASSWORD}" | docker login "${HARBOR_URL}" -u "${HARBOR_USER}" --password-stdin

    - |
      NET="${DOCKER_BUILDKIT_NETWORK}"
      BUILDER="${SQLBOT_BUILDX_BUILDER}"
      CONFIG_OPT=""
      if [ -n "${BUILDKITD_CONFIG:-}" ]; then
        CONFIG_OPT="--buildkitd-config ${BUILDKITD_CONFIG}"
      fi
      docker network inspect "${NET}" >/dev/null 2>&1 || { echo "ERROR: network '${NET}' does not exist"; exit 1; }
      if ! docker buildx inspect "${BUILDER}" >/dev/null 2>&1; then
        docker buildx create --name "${BUILDER}" --driver docker-container \
          --driver-opt "network=${NET}" ${CONFIG_OPT} --bootstrap
      fi
      docker buildx use "${BUILDER}"

    - |
      HARBOR_IMAGE="${HARBOR_URL}/${HARBOR_PROJECT}/${HARBOR_REPO}"
      TAG_PREFIX="${TAG_PREFIX:-}"
      BASE_VERSION="${BASE_VERSION:-}"
      if [ -n "${BASE_VERSION}" ]; then
        CLEAN_BASE="${BASE_VERSION#${TAG_PREFIX}}"
        IFS='.' read -r MAJOR MINOR PATCH <<< "${CLEAN_BASE}"
        NEW_TAG="${TAG_PREFIX}${MAJOR}.${MINOR}.$((PATCH + 1))"
      else
        if [ -n "${TAG_PREFIX}" ]; then TAG_REGEX="^${TAG_PREFIX}[0-9]+\\.[0-9]+\\.[0-9]+$"; else TAG_REGEX="^[0-9]+\\.[0-9]+\\.[0-9]+$"; fi
        API_URL="https://${HARBOR_URL}/api/v2.0/projects/${HARBOR_PROJECT}/repositories/${HARBOR_REPO}/artifacts?with_tag=true&page_size=50&sort=-push_time"
        RAW_JSON=$(curl -sf -u "${HARBOR_USER}:${HARBOR_PASSWORD}" "${API_URL}" || echo "")
        PREVIOUS_SEMVER_TAG=$(echo "${RAW_JSON}" | jq -r --arg re "${TAG_REGEX}" '[.[].tags[]?.name | select(test($re))][0] // empty')
        if [ -z "${PREVIOUS_SEMVER_TAG}" ] || [ "${PREVIOUS_SEMVER_TAG}" = "null" ]; then
          NEW_TAG="${TAG_PREFIX}1.0.1"
        else
          BASE="${PREVIOUS_SEMVER_TAG#${TAG_PREFIX}}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "${BASE}"
          NEW_TAG="${TAG_PREFIX}${MAJOR}.${MINOR}.$((PATCH + 1))"
        fi
      fi
      { echo "HARBOR_IMAGE=${HARBOR_IMAGE}"; echo "NEW_TAG=${NEW_TAG}"; } > ci-build.env

    - |
      set -a && . ./ci-build.env && set +a
      docker buildx build --builder "${SQLBOT_BUILDX_BUILDER}" \
        --provenance=false --sbom=false \
        -t "${HARBOR_IMAGE}:${NEW_TAG}" --load .
      { echo "HARBOR_IMAGE=${HARBOR_IMAGE}"; echo "IMAGE_TAG_VERSION=${NEW_TAG}"; } > image.env

    - docker logout "${HARBOR_URL}"

  artifacts:
    reports:
      dotenv: image.env
    expire_in: 1 day

push:
  extends: .sqlbot_rules_env
  stage: push
  needs: ["build"]
  script:
    - echo "${HARBOR_PASSWORD}" | docker login "${HARBOR_URL}" -u "${HARBOR_USER}" --password-stdin
    - docker push ${HARBOR_IMAGE}:${IMAGE_TAG_VERSION}
    - docker logout "${HARBOR_URL}"
    - echo "Pushed ${HARBOR_IMAGE}:${IMAGE_TAG_VERSION}"

deploy:
  extends: .sqlbot_rules_deploy
  stage: deploy
  resource_group: h04-sqlbot-$DEPLOY_ENVIRONMENT
  needs: ["build", "push"]
  script:
    - |
      if [ -z "${IMAGE_TAG_VERSION}" ]; then
        echo "ERROR: IMAGE_TAG_VERSION missing (dotenv from the build job required)"
        exit 1
      fi
      if [ -z "${GITOPS_PUSH_TOKEN:-}" ]; then
        echo "ERROR: CI variable GITOPS_PUSH_TOKEN missing (Project Access Token of devops/cicd/h04, scope write_repository)."
        exit 1
      fi

    - |
      GITOPS_DIR=/data/argocd/h04
      GITOPS_URL="http://gitlab-ci-token:${GITOPS_PUSH_TOKEN}@${CI_SERVER_HOST}/devops/cicd/h04.git"
      if [ ! -d "${GITOPS_DIR}/.git" ]; then
        git clone --branch main "${GITOPS_URL}" "${GITOPS_DIR}"
        git -C "${GITOPS_DIR}" remote set-url origin "http://${CI_SERVER_HOST}/devops/cicd/h04.git"
      fi
      exec 9>"${GITOPS_DIR}/.git/deploy.lock"
      flock -w 600 9
      cd "${GITOPS_DIR}"
      git config user.email "argocd@elcom.com.vn"
      git config user.name "argocd"
      git fetch "${GITOPS_URL}" main
      git reset --hard FETCH_HEAD
      git clean -fd
      f="products/h04-sqlbot/${DEPLOY_ENVIRONMENT}.yaml"
      if [ ! -f "${f}" ]; then
        echo "ERROR: ${f} not found in the gitops repository"
        exit 1
      fi
      # Pipelines can finish out of order (1.0.7 after 1.0.8). Keep the newer tag instead of rolling back; both carry the same environment prefix, so a version sort is enough.
      current="$(sed -n 's/^  tag: "\(.*\)"$/\1/p' "${f}")"
      if [ -n "${current}" ] && [ "$(printf '%s\n%s\n' "${current}" "${IMAGE_TAG_VERSION}" | sort -V | tail -n 1)" != "${IMAGE_TAG_VERSION}" ]; then
        echo "Current tag ${current} is newer than ${IMAGE_TAG_VERSION}, leaving it"
        exit 0
      fi
      # The tag is the only line that starts with two spaces and "tag:" (under image:); the env list uses "- name:" and "  value:".
      sed -i "s/^  tag: \".*\"$/  tag: \"${IMAGE_TAG_VERSION}\"/" "${f}"
      git add "${f}"
      if git diff --cached --quiet; then
        echo "Tag unchanged, nothing to commit"
        exit 0
      fi
      git commit -m "deploy(${DEPLOY_ENVIRONMENT}): bump image tag to ${IMAGE_TAG_VERSION} [skip ci]"
      for attempt in 1 2 3; do
        git push "${GITOPS_URL}" HEAD:main && exit 0
        git pull --rebase "${GITOPS_URL}" main
      done
      echo "ERROR: could not push to the gitops repo after 3 attempts"
      exit 1

cleanup:
  extends: .sqlbot_rules_env
  stage: cleanup
  needs: ["build", "push"]
  script:
    - |
      HARBOR_IMAGE="${HARBOR_IMAGE:-${HARBOR_URL}/${HARBOR_PROJECT}/${HARBOR_REPO}}"
      if [ -z "${IMAGE_TAG_VERSION}" ] || [ -z "${HARBOR_IMAGE}" ]; then exit 0; fi
      docker images "${HARBOR_IMAGE}" --format '{{.Repository}}:{{.Tag}}' | while read -r img; do
        TAG="${img##*:}"
        case "${img}" in
          "${HARBOR_IMAGE}:${IMAGE_TAG_VERSION}") ;;
          "${HARBOR_IMAGE}:<none>"|"${HARBOR_IMAGE}:") ;;
          *)
            if [ -n "${TAG_PREFIX}" ]; then
              case "${TAG}" in
                "${TAG_PREFIX}"*) docker rmi "${img}" || true ;;
              esac
            else
              case "${TAG}" in
                dev-*|stg-*|test-*|prod-*) ;;
                *) docker rmi "${img}" || true ;;
              esac
            fi
            ;;
        esac
      done
