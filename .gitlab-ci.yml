stages:
  - build
  - deploy

# ============================================================
# Global variables
# ============================================================

variables:
  IMAGE_NAME: "$HARBOR_REGISTRY/ai-sqlbot/sqlbot-backend"
  IMAGE_TAG: "test-$CI_COMMIT_SHORT_SHA"
  BACKEND_IMAGE: "$HARBOR_REGISTRY/ai-sqlbot/sqlbot-backend:test-$CI_COMMIT_SHORT_SHA"

# ============================================================
# BUILD + PUSH IMAGE
# ============================================================

build-test:
  stage: build
  tags:
    - sqlbot

  image: docker:27

  script:
    - echo "===== BUILD INFO ====="
    - echo "IMAGE_NAME=$IMAGE_NAME"
    - echo "IMAGE_TAG=$IMAGE_TAG"
    - echo "BACKEND_IMAGE=$BACKEND_IMAGE"

    - echo "===== LOGIN HARBOR ====="
    - echo "$HARBOR_PASSWORD" | docker login "$HARBOR_REGISTRY" -u "$HARBOR_USERNAME" --password-stdin

    - echo "===== BUILD BACKEND IMAGE ====="
    - docker build \
        -f Dockerfile.backend \
        -t "$BACKEND_IMAGE" \
        .

    - echo "===== PUSH BACKEND IMAGE ====="
    - docker push "$BACKEND_IMAGE"

    - echo "===== BUILD COMPLETE ====="
    - docker image inspect "$BACKEND_IMAGE"

# ============================================================
# DEPLOY TEST
# ============================================================

deploy-test:
  stage: deploy
  tags:
    - sqlbot

  image: alpine:latest

  before_script:
    - apk add --no-cache openssh-client

    - echo "===== CONFIG SSH ====="
    - mkdir -p ~/.ssh
    - echo "$DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519

    - ssh-keyscan -H "$TEST_HOST" >> ~/.ssh/known_hosts

  script:

    # --------------------------------------------------------
    # 1. Thông tin deploy
    # --------------------------------------------------------

    - echo "========================================"
    - echo "        DEPLOY BACKEND TO TEST"
    - echo "========================================"

    - echo "TEST_HOST=$TEST_HOST"
    - echo "TEST_USER=$TEST_USER"
    - echo "BACKEND_IMAGE=$BACKEND_IMAGE"

    # --------------------------------------------------------
    # 2. Test SSH
    # --------------------------------------------------------

    - echo "===== TEST SSH CONNECTION ====="

    - ssh "$TEST_USER@$TEST_HOST" "hostname"

    - ssh "$TEST_USER@$TEST_HOST" "whoami"

    # --------------------------------------------------------
    # 3. Kiểm tra Docker trên TEST
    # --------------------------------------------------------

    - echo "===== CHECK DOCKER ====="

    - ssh "$TEST_USER@$TEST_HOST" "docker version"

    # --------------------------------------------------------
    # 4. Login Harbor trên TEST
    # --------------------------------------------------------

    - echo "===== LOGIN HARBOR ON TEST ====="

    - ssh "$TEST_USER@$TEST_HOST" \
        "echo '$HARBOR_PASSWORD' | docker login '$HARBOR_REGISTRY' -u '$HARBOR_USERNAME' --password-stdin"

    # --------------------------------------------------------
    # 5. Pull image
    # --------------------------------------------------------

    - echo "===== PULL IMAGE ====="

    - ssh "$TEST_USER@$TEST_HOST" \
        "docker pull '$BACKEND_IMAGE'"

    # --------------------------------------------------------
    # 6. Kiểm tra compose file
    # --------------------------------------------------------

    - echo "===== CHECK COMPOSE FILE ====="

    - ssh "$TEST_USER@$TEST_HOST" \
        "ls -lh /data/ngocpt/sqlbot/docker-compose.backend.yml"

    # --------------------------------------------------------
    # 7. Validate Docker Compose
    # --------------------------------------------------------

    - echo "===== VALIDATE DOCKER COMPOSE ====="

    - ssh "$TEST_USER@$TEST_HOST" \
        "cd /data/ngocpt/sqlbot && \
         BACKEND_IMAGE='$BACKEND_IMAGE' \
         docker compose -f docker-compose.backend.yml config"

    # --------------------------------------------------------
    # 8. Deploy
    # --------------------------------------------------------

    - echo "===== DEPLOY DOCKER COMPOSE ====="

    - ssh "$TEST_USER@$TEST_HOST" \
        "cd /data/ngocpt/sqlbot && \
         BACKEND_IMAGE='$BACKEND_IMAGE' \
         docker compose -f docker-compose.backend.yml up -d"

    # --------------------------------------------------------
    # 9. Kiểm tra container
    # --------------------------------------------------------

    - echo "===== CHECK CONTAINER STATUS ====="

    - ssh "$TEST_USER@$TEST_HOST" \
        "cd /data/ngocpt/sqlbot && \
         BACKEND_IMAGE='$BACKEND_IMAGE' \
         docker compose -f docker-compose.backend.yml ps"

    # --------------------------------------------------------
    # 10. Kiểm tra backend container
    # --------------------------------------------------------

    - echo "===== CHECK BACKEND CONTAINER ====="

    - ssh "$TEST_USER@$TEST_HOST" \
        "docker inspect sqlbot-backend \
         --format '{{.Config.Image}}'"

    # --------------------------------------------------------
    # 11. Kiểm tra backend đang chạy
    # --------------------------------------------------------

    - echo "===== CHECK BACKEND RUNNING ====="

    - ssh "$TEST_USER@$TEST_HOST" \
        "docker ps --filter 'name=sqlbot-backend' \
         --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}'"

    echo "========================================"
    echo "       DEPLOY TEST SUCCESS"
    echo "========================================"
